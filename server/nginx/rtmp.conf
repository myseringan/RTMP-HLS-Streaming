rtmp {
    server {
        listen 1935;
        application live {
            live on;
            hls on;
            hls_path /var/www/html/stream;
            hls_fragment 3;
            hls_playlist_length 10;
            hls_cleanup on;
        }
    }
}
http {
    server {
        listen 80;
        location /stream {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /var/www/html;
        }
    }
}